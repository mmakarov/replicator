[project]
name = "replicator"
version = "7.0.0"
description = "Merge several videos with a transparent overlay and text into a YouTube-ready MP4."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Maksim Makarov" }]
keywords = ["ffmpeg", "video", "overlay", "youtube", "pyside6"]

[project.urls]
Homepage = "https://github.com/mmakarov/replicator"
Releases = "https://github.com/mmakarov/replicator/releases"

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = ["source-to-fin.py", "source-to-fin-win.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "skip"
files = ["replicator.py", "gui_qt.py", "launcher.py"]
